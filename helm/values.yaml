# Default values for python-app
replicaCount: 1

image:
  repository: 118558706226.dkr.ecr.eu-central-1.amazonaws.com/docker-sample-python
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
